name: 每日盤後台股資料更新排程

on:
  schedule:
    # 設定 UTC 時間 08:30（等同台灣時間週一至週五 16:30）
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 支援手動在網頁上隨時按按鈕立刻執行

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: 取得專案檔案
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝所需套件
        run: |
          pip install requests pandas

      - name: 執行資料計算更新
        run: |
          python update_market.py

      - name: 自動儲存更新後的 JSON 檔案
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add market_stocks.json
          git commit -m "Auto: 每日盤後自動更新全台股資料" || exit 0
          git push
