<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台股全市場量價與籌碼智慧篩選系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

  <!-- 頂部導覽列 -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40 px-6 py-4">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-chart-line text-lg text-white"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl font-bold tracking-tight text-white">台股全市場多因子量價籌碼系統</h1>
            <span class="text-xs bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full font-mono">全上市櫃 1,800+ 檔</span>
          </div>
          <p class="text-xs text-slate-400">投信鎖碼・千張大戶增・股東減・券商家數差負值・20日均量突破</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div id="data-status" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800/80 border border-slate-700 text-xs text-slate-300">
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
          <span>資料載入中...</span>
        </div>
        <button onclick="exportCSV()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-750 border border-slate-700 text-xs font-medium text-slate-200 transition flex items-center gap-1.5">
          <i class="fa-solid fa-file-arrow-down text-slate-400"></i>
          匯出 CSV
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-6 space-y-6">

    <!-- 核心條件開關儀表板 -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      <!-- 策略 A：主力投信籌碼鎖碼組 -->
      <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 flex flex-col justify-between space-y-3">
        <div>
          <span class="text-xs font-semibold uppercase tracking-wider text-indigo-400">條件一</span>
          <h3 class="font-bold text-white text-base mt-0.5">主力籌碼深度鎖碼</h3>
          <p class="text-xs text-slate-400 mt-1">投信連買 &ge; 5日、大戶增、散戶退、家數差為負</p>
        </div>
        <button id="btn-filter-chips" onclick="toggleFilter('chips')" 
                class="w-full py-2.5 px-3 rounded-xl font-medium text-xs transition flex items-center justify-center gap-2 border bg-indigo-600 hover:bg-indigo-500 text-white border-indigo-500">
          <i class="fa-solid fa-check"></i>
          籌碼集中鎖定 (已啟用)
        </button>
      </div>

      <!-- 策略 B：量能突破 -->
      <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 flex flex-col justify-between space-y-3">
        <div>
          <span class="text-xs font-semibold uppercase tracking-wider text-amber-400">條件二</span>
          <h3 class="font-bold text-white text-base mt-0.5">昨日量能爆發</h3>
          <p class="text-xs text-slate-400 mt-1">昨日成交量 &ge; 20日均量 (MA20) 1.5 倍以上</p>
        </div>
        <button id="btn-filter-vol" onclick="toggleFilter('vol')" 
                class="w-full py-2.5 px-3 rounded-xl font-medium text-xs transition flex items-center justify-center gap-2 border bg-slate-800 hover:bg-slate-750 text-slate-300 border-slate-700">
          <i class="fa-solid fa-power-off"></i>
          量增 1.5 倍以上 (未啟用)
        </button>
      </div>

      <!-- 防陷阱濾網 -->
      <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 flex flex-col justify-between space-y-3">
        <div>
          <span class="text-xs font-semibold uppercase tracking-wider text-rose-400">風控避坑</span>
          <h3 class="font-bold text-white text-base mt-0.5">排除法人陷阱標的</h3>
          <p class="text-xs text-slate-400 mt-1">排除外資大賣壓盤、權值套利、自營避險飆高</p>
        </div>
        <button id="btn-filter-traps" onclick="toggleFilter('traps')" 
                class="w-full py-2.5 px-3 rounded-xl font-medium text-xs transition flex items-center justify-center gap-2 border bg-slate-800 hover:bg-slate-750 text-slate-300 border-slate-700">
          <i class="fa-solid fa-power-off"></i>
          防踩雷濾網 (未啟用)
        </button>
      </div>

      <!-- 強化版搜尋欄位與統計 -->
      <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 flex flex-col justify-between space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold uppercase tracking-wider text-emerald-400">個股直接查詢</span>
          <button onclick="resetAllFilters()" class="text-[11px] text-indigo-400 hover:underline">
            <i class="fa-solid fa-arrows-rotate mr-1"></i>重設所有條件
          </button>
        </div>
        <div class="flex items-center gap-1.5">
          <div class="relative flex-1">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-500"></i>
            <input type="text" id="search-input" onkeydown="if(event.key==='Enter') executeSearch()" placeholder="輸入代號(如2330)或名稱..." 
                   class="w-full bg-slate-950 border border-slate-700 rounded-lg pl-8 pr-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
          <button onclick="executeSearch()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium transition">
            搜尋
          </button>
        </div>
        <div class="text-[11px] text-slate-400 flex justify-between">
          <span>目前顯示：<b id="stat-matches" class="text-emerald-400 text-sm">0</b> 檔</span>
          <span>全市場庫存：<b id="stat-total" class="text-slate-300">0</b> 檔</span>
        </div>
      </div>
    </div>

    <!-- 表格區塊 -->
    <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-950/70 text-slate-400 uppercase tracking-wider border-b border-slate-800 select-none">
            <tr>
              <th class="py-3 px-4">股票</th>
              <th class="py-3 px-3">收盤價</th>
              <th class="py-3 px-3">量比 (昨日/MA20)</th>
              <th class="py-3 px-3">昨日成交量 (張)</th>
              <th class="py-3 px-3">投信連買</th>
              <th class="py-3 px-3">千張大戶連增</th>
              <th class="py-3 px-3">散戶連減 (<50張)</th>
              <th class="py-3 px-3">股東人數變化</th>
              <th class="py-3 px-3">買賣家數差</th>
              <th class="py-3 px-3 text-center">風控狀態</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-800/60 font-mono">
            <!-- 資料列 -->
          </tbody>
        </table>
      </div>

      <!-- 分頁 -->
      <div class="p-4 border-t border-slate-800 flex items-center justify-between text-xs">
        <div id="page-info" class="text-slate-400">顯示中</div>
        <div class="flex items-center gap-2">
          <button id="btn-prev-page" onclick="changePage(-1)" class="px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 disabled:opacity-40">上一頁</button>
          <span id="current-page-num" class="px-2 font-bold text-white">1</span>
          <button id="btn-next-page" onclick="changePage(1)" class="px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 disabled:opacity-40">下一頁</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    let rawMarketData = [];
    let filteredData = [];
    let currentPage = 1;
    let pageSize = 50;

    const filters = {
      chips: false, // 預設關閉，讓使用者先看到完整列表
      vol: false,
      traps: false
    };

    window.addEventListener('DOMContentLoaded', async () => {
      await fetchMarketData();
    });

    async function fetchMarketData() {
      const statusEl = document.getElementById('data-status');
      try {
        const response = await fetch('./market_stocks.json');
        if (!response.ok) throw new Error("JSON not found");
        rawMarketData = await response.json();
        statusEl.className = "flex items-center gap-2 px-3 py-1.5 rounded-lg bg-emerald-950/60 border border-emerald-800 text-xs text-emerald-300";
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span><span>已連線 (${rawMarketData.length} 檔)</span>`;
      } catch (err) {
        rawMarketData = generateMockData();
        statusEl.className = "flex items-center gap-2 px-3 py-1.5 rounded-lg bg-amber-950/60 border border-amber-800 text-xs text-amber-300";
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span><span>展示模型 (${rawMarketData.length} 檔)</span>`;
      }

      document.getElementById('stat-total').innerText = rawMarketData.length;
      executeFiltering();
    }

    // 執行搜尋
    function executeSearch() {
      executeFiltering();
    }

    // 核心篩選引擎
    function executeFiltering() {
      const query = document.getElementById('search-input').value.trim().toLowerCase();

      filteredData = rawMarketData.filter(stock => {
        // 如果有輸入搜尋文字
        if (query) {
          const matchCode = stock.code.toLowerCase().includes(query);
          const matchName = stock.name.toLowerCase().includes(query);
          if (!matchCode && !matchName) return false;
          
          // 如果使用者正在精準搜尋特定股票（例如輸入4碼代號），允許略過上方的條件開關限制
          if (query.length >= 4 && matchCode) {
            return true;
          }
        }

        // 條件一：籌碼鎖定
        if (filters.chips) {
          if (stock.trustStreak < 5 || stock.bigHolderStreak < 3 || stock.retailStreak < 3 || stock.brokerDiff >= 0) {
            return false;
          }
        }

        // 條件二：量增 1.5 倍
        if (filters.vol && stock.volumeRatio < 1.5) {
          return false;
        }

        // 條件三：排除陷阱
        if (filters.traps && (stock.trapForeignSell || stock.trapLargeIndexArbitrage || stock.trapDealerHedgeSpike)) {
          return false;
        }

        return true;
      });

      document.getElementById('stat-matches').innerText = filteredData.length;
      currentPage = 1;
      renderTable();
    }

    function toggleFilter(type) {
      filters[type] = !filters[type];
      const btn = document.getElementById(`btn-filter-${type}`);
      if (filters[type]) {
        btn.className = "w-full py-2.5 px-3 rounded-xl font-medium text-xs transition flex items-center justify-center gap-2 border bg-indigo-600 hover:bg-indigo-500 text-white border-indigo-500";
        btn.innerHTML = `<i class="fa-solid fa-check"></i> 啟用中`;
      } else {
        btn.className = "w-full py-2.5 px-3 rounded-xl font-medium text-xs transition flex items-center justify-center gap-2 border bg-slate-800 hover:bg-slate-750 text-slate-300 border-slate-700";
        btn.innerHTML = `<i class="fa-solid fa-power-off"></i> 未啟用`;
      }
      executeFiltering();
    }

    function resetAllFilters() {
      document.getElementById('search-input').value = '';
      filters.chips = false;
      filters.vol = false;
      filters.traps = false;
      ['chips', 'vol', 'traps'].forEach(type => {
        const btn = document.getElementById(`btn-filter-${type}`);
        btn.className = "w-full py-2.5 px-3 rounded-xl font-medium text-xs transition flex items-center justify-center gap-2 border bg-slate-800 hover:bg-slate-750 text-slate-300 border-slate-700";
        btn.innerHTML = `<i class="fa-solid fa-power-off"></i> 未啟用`;
      });
      executeFiltering();
    }

    function renderTable() {
      const tbody = document.getElementById('table-body');
      const startIdx = (currentPage - 1) * pageSize;
      const pageData = filteredData.slice(startIdx, startIdx + pageSize);

      if (filteredData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" class="py-12 text-center text-slate-500">查無此股票，請點擊「重設所有條件」或檢查代號是否正確。</td></tr>`;
        document.getElementById('page-info').innerText = "0 筆";
        return;
      }

      tbody.innerHTML = pageData.map(item => `
        <tr class="hover:bg-slate-900/90 transition border-b border-slate-800/40">
          <td class="py-3 px-4 font-sans font-bold text-white">${item.code} <span class="text-slate-400 font-normal ml-1">${item.name}</span></td>
          <td class="py-3 px-3 text-slate-100">${item.price.toFixed(1)}</td>
          <td class="py-3 px-3 ${item.volumeRatio >= 1.5 ? 'text-amber-400 font-bold' : 'text-slate-400'}">${item.volumeRatio.toFixed(2)}x</td>
          <td class="py-3 px-3 text-slate-300">${item.yesterdayVol.toLocaleString()}</td>
          <td class="py-3 px-3 text-rose-400 font-bold">+${item.trustStreak} 日</td>
          <td class="py-3 px-3 text-indigo-300">${item.bigHolderStreak} 週</td>
          <td class="py-3 px-3 text-cyan-300">${item.retailStreak} 週</td>
          <td class="py-3 px-3 ${item.shareholderDiff < 0 ? 'text-emerald-400' : 'text-slate-400'}">${item.shareholderDiff} 人</td>
          <td class="py-3 px-3 ${item.brokerDiff < 0 ? 'text-emerald-400 font-bold' : 'text-slate-400'}">${item.brokerDiff} 家</td>
          <td class="py-3 px-3 text-center text-xs text-slate-400">${item.trapForeignSell ? '<span class="text-rose-400">外資壓盤</span>' : '正常'}</td>
        </tr>
      `).join('');

      const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
      document.getElementById('page-info').innerText = `顯示第 ${startIdx + 1} 至 ${Math.min(startIdx + pageSize, filteredData.length)} 筆，共 ${filteredData.length} 筆`;
      document.getElementById('current-page-num').innerText = `${currentPage} / ${totalPages}`;
      document.getElementById('btn-prev-page').disabled = currentPage <= 1;
      document.getElementById('btn-next-page').disabled = currentPage >= totalPages;
    }

    function changePage(delta) {
      currentPage += delta;
      renderTable();
    }

    function generateMockData() {
      const list = [];
      for (let i = 1; i <= 1000; i++) {
        const code = (2000 + i).toString();
        list.push({
          code: code,
          name: `台股標的-${code}`,
          market: '上市',
          price: 50 + (i % 200),
          yesterdayVol: 1500,
          ma20Vol: 1000,
          volumeRatio: 1.5,
          trustStreak: 6,
          bigHolderStreak: 3,
          retailStreak: 3,
          shareholderDiff: -120,
          brokerDiff: -25,
          trapForeignSell: false,
          trapLargeIndexArbitrage: false,
          trapDealerHedgeSpike: false
        });
      }
      return list;
    }
  </script>
</body>
</html>
